manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de callar necesidades leg\xEDtimas ni de aceptar amenazas o maltrato. Podemos expresar desacuerdo, pedir cambios y establecer l\xEDmites sin recurrir a la agresi\xF3n. Hoy vamos a practicar una habilidad concreta: la ira puede avisarnos de una frustraci\xF3n, amenaza o injusticia percibida. Reconocerla no significa obedecerla. No es necesario hacerlo perfectamente ni recordar una situaci\xF3n dolorosa. Una molestia peque\xF1a basta para aprender. Si el ejercicio produce demasiado malestar, pod\xE9s dejarlo para otro momento y buscar apoyo humano. La pr\xE1ctica frecuente, breve y voluntaria ayuda a identificar alternativas. El objetivo de esta jornada no es eliminar la ira, sino ampliar las opciones para responder con m\xE1s claridad, cuidado y seguridad.",example:"Alguien no responde un mensaje y aparece una sensaci\xF3n de rechazo.",reflectionQuestion:"\xBFQu\xE9 diferencia hay entre sentir enojo y actuar desde \xE9l?",experienceQuestion:"Record\xE1 una molestia peque\xF1a reciente. \xBFQu\xE9 emoci\xF3n apareci\xF3 primero?",quiz:[{question:"\xBFQu\xE9 es m\xE1s \xFAtil al sentir ira?",options:["Reconocerla y elegir la respuesta","Negarla por completo","Actuar inmediatamente"],correctIndex:0,explanation:"La respuesta adecuada es \xABReconocerla y elegir la respuesta\xBB. La ira puede avisarnos de una frustraci\xF3n, amenaza o injusticia percibida. Reconocerla no significa obedecerla."}],dailyChallenge:"Nombr\xE1 una emoci\xF3n antes de reaccionar.",closingMessage:"Cada vez que practic\xE1s \xBFqu\xE9 es la ira?, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:null,sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:2,unit:1,unitTitle:"Comprender la ira",title:"Sentir no es agredir",objective:"Aprender a trabajar con esta habilidad: sentir no es agredir.",reading:"La emoci\xF3n y la conducta son distintas: sentir ira no autoriza insultos, amenazas ni da\xF1os. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de callar necesidades leg\xEDtimas ni de aceptar amenazas o maltrato. Podemos expresar desacuerdo, pedir cambios y establecer l\xEDmites sin recurrir a la agresi\xF3n. Hoy vamos a practicar una habilidad concreta: la emoci\xF3n y la conducta son distintas: sentir ira no autoriza insultos, amenazas ni da\xF1os. No es necesario hacerlo perfectamente ni recordar una situaci\xF3n dolorosa. Una molestia peque\xF1a basta para aprender. Si el ejercicio produce demasiado malestar, pod\xE9s dejarlo para otro momento y buscar apoyo humano. La pr\xE1ctica frecuente, breve y voluntaria ayuda a identificar alternativas. El objetivo de esta jornada no es eliminar la ira, sino ampliar las opciones para responder con m\xE1s claridad, cuidado y seguridad.",example:"Una persona est\xE1 molesta por un retraso y elige expresar su preocupaci\xF3n sin gritar.",reflectionQuestion:"\xBFPor qu\xE9 es importante separar emoci\xF3n y conducta?",experienceQuestion:"\xBFQu\xE9 respuesta te gustar\xEDa cambiar en una discusi\xF3n leve?",quiz:[{question:"\xBFQu\xE9 conducta respeta esta diferencia?",options:["Romper algo para aliviarse","Amenazar para ser escuchado","Expresar el enojo sin agresi\xF3n"],correctIndex:2,explanation:"La respuesta adecuada es \xABExpresar el enojo sin agresi\xF3n\xBB. La emoci\xF3n y la conducta son distintas: sentir ira no autoriza insultos, amenazas ni da\xF1os."}],dailyChallenge:"Practic\xE1 una frase firme sin insultos.",closingMessage:"Cada vez que practic\xE1s sentir no es agredir, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:null,sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:3,unit:1,unitTitle:"Comprender la ira",title:"El precio de la reacci\xF3n impulsiva",objective:"Aprender a trabajar con esta habilidad: el precio de la reacci\xF3n impulsiva.",reading:"Una reacci\xF3n de segundos puede tener efectos duraderos en la confianza, la seguridad y el bienestar. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de callar necesidades leg\xEDtimas ni de aceptar amenazas o maltrato. Podemos expresar desacuerdo, pedir cambios y establecer l\xEDmites sin recurrir a la agresi\xF3n. Hoy vamos a practicar una habilidad concreta: una reacci\xF3n de segundos puede tener efectos duraderos en la confianza, la seguridad y el bienestar. No es necesario hacerlo perfectamente ni recordar una situaci\xF3n dolorosa. Una molestia peque\xF1a basta para aprender. Si el ejercicio produce demasiado malestar, pod\xE9s dejarlo para otro momento y buscar apoyo humano. La pr\xE1ctica frecuente, breve y voluntaria ayuda a identificar alternativas. El objetivo de esta jornada no es eliminar la ira, sino ampliar las opciones para responder con m\xE1s claridad, cuidado y seguridad.",example:"En una discusi\xF3n alguien lanza una frase hiriente que despu\xE9s lamenta.",reflectionQuestion:"\xBFQu\xE9 consecuencias merecen m\xE1s atenci\xF3n que ganar una discusi\xF3n?",experienceQuestion:"Pens\xE1 en un conflicto leve: \xBFqu\xE9 resultado deseabas realmente?",quiz:[{question:"\xBFQu\xE9 ayuda a decidir mejor?",options:["Ignorar el impacto en otros","Considerar consecuencias antes de actuar","Responder para ganar"],correctIndex:1,explanation:"La respuesta adecuada es \xABConsiderar consecuencias antes de actuar\xBB. Una reacci\xF3n de segundos puede tener efectos duraderos en la confianza, la seguridad y el bienestar."}],dailyChallenge:"Antes de contestar, preguntate qu\xE9 consecuencia busc\xE1s.",closingMessage:"Cada vez que practic\xE1s el precio de la reacci\xF3n impulsiva, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:null,sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:4,unit:1,unitTitle:"Comprender la ira",title:"La ira y las personas cercanas",objective:"Aprender a trabajar con esta habilidad: la ira y las personas cercanas.",reading:"Los v\xEDnculos importantes generan expectativas intensas; expresar necesidades no exige controlar a otras personas. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos n cast-01",sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:5,unit:1,unitTitle:"Comprender la ira",title:"Las se\xF1ales del cuerpo",objective:"Aprender a trabajar con esta habilidad: las se\xF1ales del cuerpo.",reading:"La tensi\xF3n, el calor, la respiraci\xF3n r\xE1pida o la mand\xEDbula apretada pueden advertir que el enojo aumenta. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de callar necesidades leg\xEDtimas ni de aceptar amenazas o maltrato. Podemos expresar desacuerdo, pedir cambios y establecer l\xEDmites sin recurrir a la agresi\xF3n. Hoy vamos a practicar una habilidad concreta: la tensi\xF3n, el calor, la respiraci\xF3n r\xE1pida o la mand\xEDbula apretada pueden advertir que el enojo aumenta. No es necesario hacerlo perfectamente ni recordar una situaci\xF3n dolorosa. Una molestia peque\xF1a basta para aprender. Si el ejercicio produce demasiado malestar, pod\xE9s dejarlo para otro momento y buscar apoyo humano. La pr\xE1ctica frecuente, breve y voluntaria ayuda a identificar alternativas. El objetivo de esta jornada no es eliminar la ira, sino ampliar las opciones para responder con m\xE1s claridad, cuidado y seguridad.",example:"Antes de levantar la voz, una persona nota sus hombros r\xEDgidos.",reflectionQuestion:"\xBFQu\xE9 se\xF1ales f\xEDsicas te parecen m\xE1s f\xE1ciles de identificar?",experienceQuestion:"\xBFD\xF3nde sent\xEDs tensi\xF3n ante una frustraci\xF3n leve?",quiz:[{question:"\xBFQu\xE9 puede indicar tensi\xF3n creciente?",options:["Que debo atacar","Que tengo que ignorarme","Que conviene revisar mi estado"],correctIndex:2,explanation:"La respuesta adecuada es \xABQue conviene revisar mi estado\xBB. La tensi\xF3n, el calor, la respiraci\xF3n r\xE1pida o la mand\xEDbula apretada pueden advertir que el enojo aumenta."}],dailyChallenge:"Observ\xE1 tres se\xF1ales corporales sin intentar cambiarlas.",closingMessage:"Cada vez que practic\xE1s las se\xF1ales del cuerpo, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:null,sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:6,unit:1,unitTitle:"Comprender la ira",title:"Reconocer detonantes",objective:"Aprender a trabajar con esta habilidad: reconocer detonantes.",reading:"Un detonante es una situaci\xF3n que suele activar malestar; conocerlo ayuda a prepararnos sin culpar al entorno. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de callar necesidades leg\xEDtimas ni de aceptar amenazas o maltrato. Podemos expresar desacuerdo, pedir cambios y establecer l\xEDmites sin recurrir a la agresi\xF3n. Hoy vamos a practicar una habilidad concreta: un detonante es una situaci\xF3n que suele activar malestar; conocerlo ayuda a prepararnos sin culpar al entorno. No es necesario hacerlo perfectamente ni recordar una situaci\xF3n dolorosa. Una molestia peque\xF1a basta para aprender. Si el ejercicio produce demasiado malestar, pod\xE9s dejarlo para otro momento y buscar apoyo humano. La pr\xE1ctica frecuente, breve y voluntaria ayuda a identificar alternativas. El objetivo de esta jornada no es eliminar la ira, sino ampliar las opciones para responder con m\xE1s claridad, cuidado y seguridad.",example:"Una interrupci\xF3n repetida provoca irritaci\xF3n durante una tarea.",reflectionQuestion:"\xBFPor qu\xE9 reconocer detonantes no equivale a justificar agresiones?",experienceQuestion:"\xBFQu\xE9 situaci\xF3n cotidiana suele molestarte?",quiz:[{question:"\xBFPara qu\xE9 sirve identificar detonantes?",options:["Para evitar toda relaci\xF3n","Para prepararme mejor","Para responsabilizar a otros"],correctIndex:1,explanation:"La respuesta adecuada es \xABPara prepararme mejor\xBB. Un detonante es una situaci\xF3n que suele activar malestar; conocerlo ayuda a prepararnos sin culpar al entorno."}],dailyChallenge:"Anot\xE1 un detonante y una respuesta segura posible.",closingMessage:"Cada vez que practic\xE1s reconocer detonantes, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:null,sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:7,unit:1,unitTitle:"Comprender la ira",title:"Expectativas y frustraci\xF3n",objective:"Aprender a trabajar con esta habilidad: expectativas y frustraci\xF3n.",reading:"Preferir que algo ocurra es distinto de exigir que necesariamente ocurra. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de callar necesidades leg\xEDtimas ni de aceptar amenazas o maltrato. Podemos expresar desacuerdo, pedir cambios y establecer l\xEDmites sin recurrir a la agresi\xF3n. Hoy vamos a practicar una habilidad concreta: preferir que algo ocurra es distinto de exigir que necesariamente ocurra. No es necesario hacerlo perfectamente ni recordar una situaci\xF3n dolorosa. Una molestia peque\xF1a basta para aprender. Si el ejercicio produce demasiado malestar, pod\xE9s dejarlo para otro momento y buscar apoyo humano. La pr\xE1ctica frecuente, breve y voluntaria ayuda a identificar alternativas. El objetivo de esta jornada no es eliminar la ira, sino ampliar las opciones para responder con m\xE1s claridad, cuidado y seguridad.",example:"Una fila avanza lentamente y aparece el pensamiento \xABesto no deber\xEDa pasar\xBB.",reflectionQuestion:"\xBFQu\xE9 cambia al sustituir \xABdebe\xBB por \xABpreferir\xEDa\xBB?",experienceQuestion:"\xBFQu\xE9 expectativa reciente no se cumpli\xF3?",quiz:[{question:"\xBFQu\xE9 pensamiento es m\xE1s flexible?",options:["Preferir\xEDa que fuera distinto","Es intolerable que pase","Todo debe salir a mi modo"],correctIndex:0,explanation:"La respuesta adecuada es \xABPreferir\xEDa que fuera distinto\xBB. Preferir que algo ocurra es distinto de exigir que necesariamente ocurra."}],dailyChallenge:"Reformul\xE1 una exigencia como preferencia.",closingMessage:"Cada vez que practic\xE1s expectativas y frustraci\xF3n, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:null,sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libr bjetivo de esta jornada no es eliminar la ira, sino ampliar las opciones para responder con m\xE1s claridad, cuidado y seguridad.",example:"Alguien cambia de opini\xF3n y otra persona intenta obligarlo a volver atr\xE1s.",reflectionQuestion:"\xBFQu\xE9 parte de un desacuerdo depende realmente de vos?",experienceQuestion:"Identific\xE1 algo que quisiste controlar sin poder hacerlo.",quiz:[{question:"\xBFQu\xE9 suele depender de m\xED?",options:["Todas las circunstancias","Mi forma de responder","Los pensamientos ajenos"],correctIndex:1,explanation:"La respuesta adecuada es \xABMi forma de responder\xBB. No controlamos todas las decisiones ajenas, pero podemos trabajar nuestras acciones, l\xEDmites y peticiones."}],dailyChallenge:"Hac\xE9 dos columnas: \xABdepende de m\xED\xBB y \xABno depende de m\xED\xBB.",closingMessage:"Cada vez que practic\xE1s lo que puedo controlar, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:null,sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:10,unit:1,unitTitle:"Comprender la ira",title:"Mi mapa de la ira",objective:"Aprender a trabajar con esta habilidad: mi mapa de la ira.",reading:"Un mapa personal re\xFAne detonantes, se\xF1ales, pensamientos y conductas para reconocer patrones. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de idado y seguridad.",example:"A: cancelan un plan; B: \xABno deber\xEDan hacerme esto\xBB; C: ira intensa.",reflectionQuestion:"\xBFQu\xE9 parte del ABC te parece m\xE1s dif\xEDcil de identificar?",experienceQuestion:"Record\xE1 un inconveniente leve y complet\xE1 A, B y C.",quiz:[{question:"\xBFQu\xE9 representa B?",options:["La consecuencia","La creencia o interpretaci\xF3n","La respiraci\xF3n"],correctIndex:1,explanation:"La respuesta adecuada es \xABLa creencia o interpretaci\xF3n\xBB. En TREC, A es acontecimiento, B creencia y C consecuencia emocional o conductual; las creencias influyen en la reacci\xF3n."}],dailyChallenge:"Anot\xE1 un ABC breve sin juzgarlo.",closingMessage:"Cada vez que practic\xE1s el modelo abc, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:"podcast-03",sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:13,unit:2,unitTitle:"Pensamientos y creencias",title:"Las exigencias r\xEDgidas",objective:"Aprender a trabajar con esta habilidad: las exigencias r\xEDgidas.",reading:"Palabras como \xABdebe\xBB, \xABsiempre\xBB o \xABjam\xE1s\xBB pueden convertir preferencias leg\xEDtimas en reglas inflexibles. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de callar necesidades leg\xEDtimas ni de aceptar amenazas o maltrato. Podemos expresar desacuerd lestar, pod\xE9s dejarlo para otro momento y buscar apoyo humano. La pr\xE1ctica frecuente, breve y voluntaria ayuda a identificar alternativas. El objetivo de esta jornada no es eliminar la ira, sino ampliar las opciones para responder con m\xE1s claridad, cuidado y seguridad.",example:"Alguien piensa \xABnunca me ayudan\xBB y recuerda dos ocasiones distintas.",reflectionQuestion:"\xBFC\xF3mo revisar una idea sin invalidar tu malestar?",experienceQuestion:"\xBFQu\xE9 afirmaci\xF3n absoluta podr\xEDas contrastar?",quiz:[{question:"\xBFQu\xE9 pregunta es \xFAtil?",options:["\xBFQu\xE9 pruebas tengo?","\xBFC\xF3mo obligo a que me den raz\xF3n?","\xBFPor qu\xE9 siempre me pasa todo?"],correctIndex:0,explanation:"La respuesta adecuada es \xAB\xBFQu\xE9 pruebas tengo?\xBB. Las creencias pueden contrastarse con datos a favor y en contra sin negar experiencias reales."}],dailyChallenge:"Anot\xE1 una evidencia a favor y otra en contra.",closingMessage:"Cada vez que practic\xE1s buscar evidencia, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:null,sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:23,unit:3,unitTitle:"Cuestionar creencias",title:"No leer la mente",objective:"Aprender a trabajar con esta habilidad: no leer la mente.",reading:"Atribuir intenciones sin preguntar puede aumentar resentimiento y conflicto. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, ex }],dailyChallenge:"Ped\xED algo con claridad y acept\xE1 una respuesta diferente.",closingMessage:"Cada vez que practic\xE1s preferir no es exigir, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:"podcast-06",sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:25,unit:3,unitTitle:"Cuestionar creencias",title:"Cambiar pensamientos extremos",objective:"Aprender a trabajar con esta habilidad: cambiar pensamientos extremos.",reading:"T\xE9rminos como \xABtodo\xBB, \xABnada\xBB y \xABsiempre\xBB pueden borrar matices importantes. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de callar necesidades leg\xEDtimas ni de aceptar amenazas o maltrato. Podemos expresar desacuerdo, pedir cambios y establecer l\xEDmites sin recurrir a la agresi\xF3n. Hoy vamos a practicar una habilidad concreta: t\xE9rminos como \xABtodo\xBB, \xABnada\xBB y \xABsiempre\xBB pueden borrar matices importantes. No es necesario hacerlo perfectamente ni recordar una situaci\xF3n dolorosa. Una molestia peque\xF1a basta para aprender. Si el ejercicio produce demasiado malestar, pod\xE9s dejarlo para otro momento y buscar apoyo humano. La pr\xE1ctica frecuente, breve y voluntaria ayuda a identificar alternativas. El objetivo de esta jornada no es eliminar la ira, sino ampliar las opciones para responder con m\xE1s claridad, cuidado y seguridad.",example:"Un desacuerdo se convierte mentalmente en \xABnada funciona\xBB.",reflectionQuestion:"\xBFQu\xE9 matices faltan en las frases extremas?",experienceQuestion:"\xBFQu\xE9 afirmaci\xF3n absoluta pod\xE9s matizar?",quiz:[{question:"\xBFCu\xE1l frase tiene matices?",options:["Hoy hubo un desacuerdo","Nunca hacemos nada bien","Todo est\xE1 perdido"],correctIndex:0,explanation:"La respuesta adecuada es \xABHoy hubo un desacuerdo\xBB. T\xE9rminos como \xABtodo\xBB, \xABnada\xBB y \xABsiempre\xBB pueden borrar matices importantes."}],dailyChallenge:"Reescrib\xED una frase extrema con datos concretos.",closingMessage:"Cada vez que practic\xE1s cambiar pensamientos extremos, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:null,sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:26,unit:3,unitTitle:"Cuestionar creencias",title:"Aceptar diferencias",objective:"Aprender a trabajar con esta habilidad: aceptar diferencias.",reading:"Otras personas pueden pensar distinto sin que esa diferencia sea una agresi\xF3n. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de callar necesidades leg\xEDtimas ni de aceptar amenazas o maltrato. Podemos expresar desacuerdo, pedir cambios y establecer l\xEDmites sin recurrir a la agresi\xF3n. Hoy vamos a practicar una habilidad concreta: otras personas pueden pensar distinto sin que esa diferencia sea una agresi\xF3n. No es necesario hacerlo perfectamente ni recordar una situaci\xF3n dolorosa. Una molestia peque\xF1a basta para aprender. Si el ejercicio produce demasiado malestar, pod\xE9s dejarlo para otro momento y buscar apoyo humano. La pr\xE1ctica frecuente, breve y voluntaria ayuda a identificar alternativas. El objetivo de esta jornada no es eliminar la ira, sino ampliar las opciones para responder con m\xE1s claridad, cuidado y seguridad.",example:"Dos familiares discrepan sobre c\xF3mo organizar un fin de semana.",reflectionQuestion:"\xBFQu\xE9 diferencia te cuesta aceptar?",experienceQuestion:"\xBFC\xF3mo podr\xEDas expresar desacuerdo sin descalificar?",quiz:[{question:"\xBFQu\xE9 demuestra respeto?",options:["Exigir coincidencia","Ridiculizar al otro","Discrepar sin atacar"],correctIndex:2,explanation:"La respuesta adecuada es \xABDiscrepar sin atacar\xBB. Otras personas pueden pensar distinto sin que esa diferencia sea una agresi\xF3n."}],dailyChallenge:"Escuch\xE1 una opini\xF3n diferente sin interrumpir, si es seguro.",closingMessage:"Cada vez que practic\xE1s aceptar diferencias, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:null,sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:27,unit:3,unitTitle:"Cuestionar creencias",title:"Autoaceptaci\xF3n responsable",objective:"Aprender a trabajar con esta habilidad: autoaceptaci\xF3n responsable.",reading:"Aceptar la propia dignidad no equivale a aprobar conductas da\xF1inas; ambas ideas pueden coexistir. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas qu os ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de callar necesidades leg\xEDtimas ni de aceptar amenazas o maltrato. Podemos expresar desacuerdo, pedir cambios y establecer l\xEDmites sin recurrir a la agresi\xF3n. Hoy vamos a practicar una habilidad concreta: el ABCDE permite revisar una situaci\xF3n concreta sin negar necesidades ni responsabilidades. No es necesario hacerlo perfectamente ni recordar una situaci\xF3n dolorosa. Una molestia peque\xF1a basta para aprender. Si el ejercicio produce demasiado malestar, pod\xE9s dejarlo para otro momento y buscar apoyo humano. La pr\xE1ctica frecuente, breve y voluntaria ayuda a identificar alternativas. El objetivo de esta jornada no es eliminar la ira, sino ampliar las opciones para responder con m\xE1s claridad, cuidado y seguridad.",example:"Una cr\xEDtica despierta ira; al cuestionar \xABno pueden criticarme\xBB, alguien responde con preguntas.",reflectionQuestion:"\xBFQu\xE9 parte del ABCDE te result\xF3 m\xE1s \xFAtil?",experienceQuestion:"Aplic\xE1 ABCDE a un desacuerdo peque\xF1o y seguro.",quiz:[{question:"\xBFQu\xE9 busca E?",options:["Dar siempre la raz\xF3n","Una respuesta m\xE1s eficaz","No sentir nunca nada"],correctIndex:1,explanation:"La respuesta adecuada es \xABUna respuesta m\xE1s eficaz\xBB. El ABCDE permite revisar una situaci\xF3n concreta sin negar necesidades ni responsabilidades."}],dailyChallenge:"Complet\xE1 un ABCDE y guardalo.",closingMessage:"Cada vez que practic\xE1s abcde en un conflicto, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:null,sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente d 3n?",quiz:[{question:"\xBFQu\xE9 fortalece una disculpa?",options:["Culpar a la otra persona","Reconocer el da\xF1o y cambiar","Exigir perd\xF3n inmediato"],correctIndex:1,explanation:"La respuesta adecuada es \xABReconocer el da\xF1o y cambiar\xBB. Una disculpa reconoce el da\xF1o, evita excusas y respeta que la otra persona decida c\xF3mo continuar."}],dailyChallenge:"Escrib\xED una disculpa que no incluya \xABpero\xBB.",closingMessage:"Cada vez que practic\xE1s disculpas sinceras, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:"podcast-12",sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:49,unit:5,unitTitle:"Comunicaci\xF3n y responsabilidad",title:"Reparar con acciones",objective:"Aprender a trabajar con esta habilidad: reparar con acciones.",reading:"La reparaci\xF3n exige conductas sostenidas y respeto por los l\xEDmites de quien fue afectado. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de callar necesidades leg\xEDtimas ni de aceptar amenazas o maltrato. Podemos expresar desacuerdo, pedir cambios y establecer l\xEDmites sin recurrir a la agresi\xF3n. Hoy vamos a practicar una habilidad concreta: la reparaci\xF3n exige conductas sostenidas y respeto por los l\xEDmites de quien fue afectado. No es necesario hacerlo perfectamente ni recordar una situaci\ o puede verse en peque\xF1as decisiones, incluso si el enojo sigue apareciendo."}],dailyChallenge:"Anot\xE1 una habilidad que hayas practicado.",closingMessage:"Cada vez que practic\xE1s reconocer avances, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:null,sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:52,unit:6,unitTitle:"Consolidaci\xF3n y prevenci\xF3n",title:"Se\xF1ales tempranas",objective:"Aprender a trabajar con esta habilidad: se\xF1ales tempranas.",reading:"Revisar las primeras se\xF1ales permite intervenir antes de una escalada. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de callar necesidades leg\xEDtimas ni de aceptar amenazas o maltrato. Podemos expresar desacuerdo, pedir cambios y establecer l\xEDmites sin recurrir a la agresi\xF3n. Hoy vamos a practicar una habilidad concreta: revisar las primeras se\xF1ales permite intervenir antes de una escalada. No es necesario hacerlo perfectamente ni recordar una situaci\xF3n dolorosa. Una molestia peque\xF1a basta para aprender. Si el ejercicio produce demasiado malestar, pod\xE9s dejarlo para otro momento y buscar apoyo humano. La pr\xE1ctica frecuente, breve y voluntaria ayuda a identificar alternativas. El objetivo de esta jornada no es eliminar la ira, sino ampliar las opciones para responder con m\xE1s claridad, cuidado y seguridad.",example:"Alguien reconoce cansancio y tensi\xF3n antes de una conversaci\xF3n dif\xEDcil.",reflectionQuestion:"\xBFCu\xE1l es tu se\xF1al m\xE1s confiable?",experienceQuestion:"\xBFQu\xE9 pas\xF3 la \xFAltima vez que la detectaste?",quiz:[{question:"\xBFQu\xE9 es prevenci\xF3n?",options:["Actuar ante se\xF1ales iniciales","Esperar hasta explotar","Negar la molestia"],correctIndex:0,explanation:"La respuesta adecuada es \xABActuar ante se\xF1ales iniciales\xBB. Revisar las primeras se\xF1ales permite intervenir antes de una escalada."}],dailyChallenge:"Cre\xE1 una tarjeta con tres se\xF1ales personales.",closingMessage:"Cada vez que practic\xE1s se\xF1ales tempranas, ampli\xE1s tus posibilidades de responder con responsabilidad.",selfEvaluation:{question:"\xBFQu\xE9 tan \xFAtil te result\xF3 lo aprendido hoy?",options:["Nada \xFAtil","Poco \xFAtil","Algo \xFAtil","Bastante \xFAtil","Muy \xFAtil"]},podcastId:"podcast-13",sourceFramework:"TREC: adaptaci\xF3n psicoeducativa original; correspondencia exacta con el libro pendiente de revisi\xF3n editorial"},{day:53,unit:6,unitTitle:"Consolidaci\xF3n y prevenci\xF3n",title:"Ensayar situaciones",objective:"Aprender a trabajar con esta habilidad: ensayar situaciones.",reading:"Practicar respuestas con situaciones leves ayuda a prepararnos sin exponernos a conflictos peligrosos. En el enfoque racional emotivo-conductual de Albert Ellis, es \xFAtil observar tanto lo que ocurre como las ideas que aparecen en nuestra mente. Una situaci\xF3n puede ser realmente desagradable, injusta o dif\xEDcil; reconocer nuestras interpretaciones no significa negar los hechos ni excusar las acciones de nadie. Aprender a manejar la ira consiste en reconocer la emoci\xF3n, examinar las creencias que pueden intensificarla y elegir una conducta responsable. No se trata de callar necesidades leg\xEDtimas ni de aceptar amenazas o maltrato. Podemos expresar desacuerdo, pedir cambios y establecer l\xEDmites sin r
